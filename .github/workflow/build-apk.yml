name: Build Rep APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir -p www
          cp rep-app.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "rep",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.rep.app","appName":"Rep","webDir":"www","server":{"androidScheme":"https"},"backgroundColor":"#0C0908"}
          EOF
          npm install
          npx cap add android
      - name: Icons, signing key and version
        run: |
          pip install pillow
          cat > make_icons.py <<'EOF'
          import glob,os
          from PIL import Image,ImageDraw
          BG='#6B1428';TAN='#C79A6D';CUR='#EAE3DD'
          R=["11110","10001","10001","11110","10100","10010","10001"]
          def draw(S,transparent=False,circle=False):
              im=Image.new('RGBA',(S,S),(0,0,0,0) if transparent else BG)
              d=ImageDraw.Draw(im);c=S*36/512;o=(S-7*c)/2
              for r,row in enumerate(R):
                  for q,ch in enumerate(row):
                      if ch=='1':d.rectangle([o+q*c,o+r*c,o+(q+1)*c-1,o+(r+1)*c-1],fill=TAN)
              d.rectangle([o+6*c,o+5*c,o+7*c-1,o+7*c-1],fill=CUR)
              if circle:
                  m=Image.new('L',(S,S),0);ImageDraw.Draw(m).ellipse([0,0,S-1,S-1],fill=255);im.putalpha(m)
              return im
          res=os.environ.get('RES','android/app/src/main/res')
          for n,l,f in [('mdpi',48,108),('hdpi',72,162),('xhdpi',96,216),('xxhdpi',144,324),('xxxhdpi',192,432)]:
              d=res+'/mipmap-'+n;os.makedirs(d,exist_ok=True)
              draw(l).save(d+'/ic_launcher.png');draw(l,circle=True).save(d+'/ic_launcher_round.png');draw(f,transparent=True).save(d+'/ic_launcher_foreground.png')
          os.makedirs(res+'/mipmap-anydpi-v26',exist_ok=True);os.makedirs(res+'/values',exist_ok=True)
          x='<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/rep_icon_bg"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>\n'
          for n in ('ic_launcher','ic_launcher_round'):open(res+'/mipmap-anydpi-v26/'+n+'.xml','w').write(x)
          open(res+'/values/rep_icon_bg.xml','w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="rep_icon_bg">#6B1428</color></resources>\n')
          for p in glob.glob(res+'/**/splash.png',recursive=True):
              im=Image.open(p);Image.new('RGB',im.size,BG).save(p)
          EOF
          python3 make_icons.py
          mkdir -p ~/.android
          base64 -d > ~/.android/debug.keystore <<'EOF'
