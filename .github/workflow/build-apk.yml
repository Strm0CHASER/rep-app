          sed -i "s/versionCode [0-9][0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Rep.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Rep-APK
          path: Rep.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rep build ${{ github.run_number }}
          body: Download Rep.apk below and install it on your Android phone.
          files: Rep.apk
