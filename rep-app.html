<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rep</title><meta name="theme-color" content="#6B1428">
<style>
:root{--bg:#0C0908;--c:#181210;--b:#20160F;--n:#171717;--bu:#8B1A32;--hc:#6B1428;--bd:#3E0C19;--br:#5C4033;--bl:#9A6B47;--t:#C79A6D;--m:#A89C94;--x:#EAE3DD;--o:#D9794F;--ta:#C79A6D;color-scheme:dark}
*{box-sizing:border-box;border-radius:var(--rd,0)!important;margin:0}
body{background:var(--bg);color:var(--x);font:14px/1.5 ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Courier New",monospace;padding-top:env(safe-area-inset-top)}
#app{max-width:560px;margin:0 auto;padding:12px 12px 150px;overflow-x:hidden}
.card{border:1px dashed var(--br);background:var(--c);padding:12px;margin-bottom:12px}
.card:nth-of-type(3n+2){background:var(--b)}.card:nth-of-type(3n){background:var(--n)}
.hc{background:var(--hc)!important;border-color:var(--t)}
h1{font-size:18px;margin-bottom:10px}h1:before,h2:before{color:var(--t)}h1:before{content:"# "}
h2{font-size:14px;margin-bottom:8px}h2:before{content:"> "}
.p{color:var(--t);margin-bottom:4px}.m,small{color:var(--m)}.tn{color:var(--t)}
.cur{display:inline-block;width:.6em;height:1em;background:var(--t);vertical-align:-2px;margin-left:4px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}@keyframes bob{50%{transform:translateY(1px)}}.bob{animation:bob 1s steps(1) infinite}
button,input,select,textarea{font:inherit;color:var(--x);background:var(--bg);border:1px solid var(--br);padding:10px;min-height:44px;min-width:0}
button{background:var(--bu);border-color:var(--bu);color:#F3ECE6;cursor:pointer;text-transform:lowercase}
button.g{background:none;border-color:var(--br);color:var(--t)}button.on{background:var(--bu);color:#F3ECE6;border-color:var(--bu)}
:focus-visible{outline:2px solid var(--t);outline-offset:2px}
.bad{border-color:var(--o)!important}
label{display:block;color:var(--m);margin:6px 0}label input,label select{display:block;width:100%;margin-top:2px}.card>input{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.row input{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.g4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px;margin-bottom:6px}.g4 input{padding:8px 4px}
.tl{padding:12px;border:1px dashed var(--t)}.tl b{display:block;font-size:20px}
.bar{height:12px;background:var(--bd);border:1px solid var(--br);margin:4px 0 8px}.bar i{display:block;height:100%}
.bb{border:1px dashed var(--t);padding:8px;color:var(--t);background:var(--bg);font-size:13px;flex:1}
.ch{display:flex;gap:6px;height:110px}.cl{flex:1;display:flex;flex-direction:column;min-width:0}.cb{flex:1;display:flex;align-items:flex-end;gap:2px}.cb i{flex:1;min-height:2px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--br);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--m);padding:10px 2px;font-size:12px}nav button.on{background:var(--bd);color:var(--t)}
.fab{position:fixed;right:max(12px,calc(50% - 268px));bottom:calc(64px + env(safe-area-inset-bottom));box-shadow:0 0 0 2px var(--bg)}
.sh{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;z-index:5}
.sh>div{background:var(--c);border-top:1px dashed var(--t);width:100%;max-width:560px;margin:0 auto;max-height:92%;overflow:auto;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sh button{margin:6px 6px 0 0}
.ts{display:flex;align-items:center;gap:8px;color:#F3ECE6;position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--bu);padding:8px 16px;z-index:8}
.lv{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--x);padding:20px;overflow:auto}
.bk{animation:bl 1s steps(1) infinite}
.ey{transform-box:fill-box;transform-origin:center;animation:eb 4s steps(1) infinite}@keyframes eb{0%,94%{transform:none}96%{transform:scaleY(.2)}}
.lf{animation:lf .8s steps(1) infinite}@keyframes lf{50%{transform:translateY(-1px)}}.tw{animation:bl 1s steps(1) infinite}.dr{animation:bob 1s steps(1) infinite}
.hop{animation:hop .4s steps(2)}@keyframes hop{50%{transform:translateY(-12px)}}
:root[data-theme=light]{--bg:#F5EFE9;--c:#FFFFFF;--b:#F1E7DD;--n:#ECE9E7;--br:#CDB9A8;--bl:#9A6B47;--t:#7A4F26;--m:#6B5F58;--x:#1E1512;--o:#B5501F;color-scheme:light}.hc,.bd{--bg:#0C0908;--x:#EAE3DD;--m:#A89C94;--t:var(--ta);color:#EAE3DD}nav button.on{color:var(--ta)}
:root[data-scheme=ocean]{--bu:#1F5F8B;--hc:#123F5C;--bd:#0B2536;--br:#2F4F66;--bl:#3F7FA6;--t:#7FB6D9;--ta:#7FB6D9;--b:#0E1A24}
:root[data-scheme=forest]{--bu:#2F6B3F;--hc:#1D4A2B;--bd:#0F2A18;--br:#3A5A44;--bl:#5E9A6F;--t:#8DC59B;--ta:#8DC59B;--b:#101C14}
:root[data-scheme=amber]{--bu:#A8650A;--hc:#7A4A08;--bd:#3F2704;--br:#6B5226;--bl:#C9922E;--t:#E8B550;--ta:#E8B550;--b:#1E160A}
:root[data-scheme=plum]{--bu:#6E2C7F;--hc:#4F1F5C;--bd:#2E1236;--br:#59405F;--bl:#9A66AB;--t:#C9A0D8;--ta:#C9A0D8;--b:#1B1220}
:root[data-scheme=mono]{--bu:#5A5A5A;--hc:#3A3A3A;--bd:#242424;--br:#4A4A4A;--bl:#8A8A8A;--t:#CFCFCF;--ta:#CFCFCF;--b:#1A1A1A}
:root[data-theme=light][data-scheme=ocean]{--b:#E4EEF5;--br:#A9C2D3;--bl:#3F7FA6;--t:#1F5F8B}
:root[data-theme=light][data-scheme=forest]{--b:#E3EFE6;--br:#A8C5B0;--bl:#4F8A5F;--t:#2F6B3F}
:root[data-theme=light][data-scheme=amber]{--b:#F6ECD8;--br:#D8C08A;--bl:#B8730F;--t:#8A5508}
:root[data-theme=light][data-scheme=plum]{--b:#F0E6F4;--br:#C9B0D3;--bl:#8A4A9C;--t:#6E2C7F}
:root[data-theme=light][data-scheme=mono]{--b:#EEEEEE;--br:#C4C4C4;--bl:#6A6A6A;--t:#3A3A3A;--bu:#4A4A4A}
:root[data-style=clean] body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}:root[data-style=classic] body{font-family:ui-serif,Georgia,Times New Roman,serif}
:root[data-style=clean]{--rd:12px}:root[data-style=classic]{--rd:4px}
:root[data-style=clean] .p,:root[data-style=classic] .p{display:none}
:root[data-style=clean] h1:before,:root[data-style=clean] h2:before,:root[data-style=classic] h1:before,:root[data-style=classic] h2:before{content:none}
:root[data-style=clean] .card,:root[data-style=clean] .tl,:root[data-style=clean] .bb{border-style:solid}
.pb{display:inline-block;width:140px;max-width:100%;height:10px;background:var(--bd);border:1px solid var(--br);vertical-align:-1px}.pb i{display:block;height:100%;background:var(--bl)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="app"></div>
<nav aria-label="main"><button data-a="go" data-v="home">[home]</button><button data-a="go" data-v="log">[log]</button><button data-a="go" data-v="plan">[plan]</button><button data-a="go" data-v="fuel">[fuel]</button><button data-a="go" data-v="hero">[stats]</button><button data-a="go" data-v="setup">[setup]</button></nav>
<button class="fab" id="fab" data-a="fab"></button>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const D0=()=>({u:'kg',det:0,nm:'Hero',gs:['Chest','Back','Legs','Shoulders','Arms','Core','Cardio','Mobility','Other'],goal:4,rt:[],dn:{},wo:[],ck:{},xp:[],pf:0,tg:{},ml:{},fc:['Core'],eq:'home',cx:[],pn:[],th:'dark'});
let S=D0(),tab='home',wf=0,ers=0,ed=null;
try{Object.assign(S,JSON.parse(localStorage.getItem('rep1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('rep1',JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9),DN=['mon','tue','wed','thu','fri','sat','sun'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const a=s.split('-');return new Date(a[0],a[1]-1,a[2])};
const ad=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const mon=s=>ad(s,-((pd(s).getDay()+6)%7)),today=()=>iso(new Date()),cwk=()=>mon(today()),SW=()=>ad(cwk(),wf*7);
const fd=s=>pd(s).toLocaleDateString(undefined,{month:'short',day:'numeric'}).toLowerCase(),dl=s=>DN[(pd(s).getDay()+6)%7];
const cv=k=>+(S.u=='lb'?k*2.20462:k).toFixed(1),tk=v=>S.u=='lb'?v/2.20462:v;
const bl=(f,n=20)=>{f=Math.max(0,Math.min(1,f));if(S.st=='clean')return`<span class="pb"><i style="width:${f*100}%"></i></span>`;const k=Math.round(f*n);return'['+'█'.repeat(k)+'░'.repeat(n-k)+']'};
const bar=(f,c)=>`<div class="bar"><i style="width:${Math.min(100,f*100)}%;background:var(${c})"></i></div>`;
const COL=['#8B1A32','#A0704A','#6B1B2E','#C4A484','#7A736F','#5E463A','#B8B0AB','#7A2E22','#8A7B6E','#D8CCC0'];
const sc=x=>(x.ex||[]).reduce((a,e)=>a+e.s,0),vl=x=>(x.ex||[]).reduce((a,e)=>a+e.s*e.r*e.w,0);
/* ---- data ---- */
function sess(ws){const o=[];S.rt.forEach(r=>{if(r.cw>ws)return;r.d.forEach(i=>{const dt=ad(ws,i),k=r.id+'_'+dt,s=S.dn[k];if(r.cd&&dt<r.cd)return;if(r.p&&!s)return;const q=s||r;o.push({k,dt,n:q.n,g:q.g,m:q.m,done:!!s,od:!s&&dt<today()})})});return o.sort((a,b)=>a.dt<b.dt?-1:1)}
function W(ws){const ss=sess(ws),we=ad(ws,6),w=S.wo.filter(x=>x.date>=ws&&x.date<=we),dn=ss.filter(x=>x.done),all=[...w,...dn];let sets=0,vol=0,min=0,gs={},gm={};
w.forEach(x=>{const s=sc(x);sets+=s;vol+=vl(x);gs[x.g]=(gs[x.g]||0)+s});all.forEach(x=>{min+=x.m;gm[x.g]=(gm[x.g]||0)+x.m});
const P=ss.length,T=P||S.goal,C=all.length;return{ss,w,dn,all,sets,vol,min,gs,gm,P,T,C,ok:C>=T,od:ss.some(x=>x.od)}}
function streaks(){const n=cwk();let f=n,run=0,best=0;S.wo.forEach(x=>{if(x.date<f)f=mon(x.date)});S.rt.forEach(r=>{if(r.cw<f)f=r.cw});
for(let w=f;w<n;w=ad(w,7)){run=W(w).ok?run+1:0;best=Math.max(best,run)}if(W(n).ok)run++;return{cur:run,best:Math.max(best,run)}}
const tx=()=>S.xp.reduce((a,e)=>a+e.a,0);
function lvl(x=tx()){let n=1;while(x>=100+50*(n-1)){x-=100+50*(n-1);n++}return{n,i:x,nd:100+50*(n-1)}}
const rk=n=>n<5?'E':n<10?'D':n<20?'C':n<30?'B':n<40?'A':'S',cl=n=>n<5?0:n<10?1:n<20?2:3,CN=['rookie','fighter','knight','champion'];
const mu=()=>1+Math.min(.5,.1*streaks().cur),ev=(a,why,ref)=>S.xp.push({id:uid(),a:Math.round(a),why,ref,dt:today()});
const Q=[{i:'g',t:'log 3 muscle groups',n:3,x:40,f:w=>new Set(w.all.map(x=>x.g)).size},
{i:'p',t:'beat a personal best',n:1,x:50,f:w=>w.w.filter(x=>S.xp.some(e=>e.ref==x.id&&e.why=='personal best')).length},
{i:'s',t:'log sleep on 5 days',n:5,x:40,f:(w,ws)=>[0,1,2,3,4,5,6].filter(i=>(S.ck[ad(ws,i)]||{}).sl>0).length},
{i:'l',t:'finish a 45+ min workout',n:1,x:30,f:w=>w.all.filter(x=>x.m>45).length}];
const wq=ws=>{const k=Math.floor(pd(ws)/6048e5)%4;return[0,1,2].map(i=>Q[(k+i)%4])};
function fix(r,on,a,why){const h=S.xp.some(e=>e.ref==r);if(on&&!h)S.xp.push({id:uid(),a,why,ref:r,dt:today()});if(!on&&h)S.xp=S.xp.filter(e=>e.ref!=r)}
function sync(){const n=cwk();for(let i=0;i<8;i++){const ws=ad(n,-7*i),w=W(ws);fix('goal_'+ws,w.ok,100,'weekly goal');wq(ws).forEach(q=>fix('q'+q.i+ws,q.f(w,ws)>=q.n,q.x,'quest: '+q.t))}{const m=today().slice(0,7),c=MC[mi(m)];fix('mc_'+m,c[2](m)>=c[1],150,'monthly: '+c[0])}dm().forEach(d=>fix('d_'+d[0]+today(),d[3],d[2],'daily: '+d[1]));save()}
function stats(){const all=[...S.wo.map(x=>({g:x.g,m:x.m,s:sc(x)})),...Object.values(S.dn).map(v=>({g:v.g,m:v.m,s:0}))];let a=0,b=0,c=0,d=0;
all.forEach(x=>{if(x.g=='Cardio')b+=x.m;else if(x.g=='Mobility')c+=x.m/15;if(x.g=='Core')d+=x.s||x.m/6;else if(!['Cardio','Mobility','Other'].includes(x.g))a+=x.s||x.m/6});
const v=Object.values(S.ck).filter(k=>k.sl>0||k.wa>0).length;return{STR:1+Math.floor(a/10),END:1+Math.floor(b/30),AGI:1+Math.floor(c+all.length/4),VIT:1+Math.floor(v/2),CORE:1+Math.floor(d/10)}}
function badges(){const st=streaks(),n=S.wo.length+Object.keys(S.dn).length,wk={};S.wo.forEach(x=>{const k=mon(x.date);wk[k]=(wk[k]||0)+sc(x)});
return[['first workout',n>0],['3-week streak',st.best>=3],['10 workouts',n>=10],['50 sets in a week',Object.values(wk).some(v=>v>=50)],['first personal best',S.xp.some(e=>e.why=='personal best')],['early riser',S.wo.filter(x=>x.t&&x.t<'09:00').length>=3],['iron week',st.best>=1],['level 10',lvl().n>=10],['5 core sessions',S.wo.filter(x=>x.g=='Core').length>=5],['lost 2 kg',!!S.pf&&S.pf.sw-curW()>=2]]}
function pbs(){const b={};S.wo.forEach(x=>(x.ex||[]).forEach(e=>{const k=e.n.toLowerCase();if(!b[k]||e.w>b[k].w)b[k]={n:e.n,w:e.w,d:x.date}}));return Object.values(b).sort((a,c)=>c.w-a.w).slice(0,3)}
const mood=w=>w.ok?3:w.od?2:w.C?1:0;
function bub(m,w){const r=w.T-w.C;return['> idle. log a session to wake up.',`> ${r} more session${r>1?'s':''} clears this week's quest`,'> overdue sessions. catch up, hero.','> quest complete. rest up, hero.'][m]}
/* ---- hero sprite ---- */
const PL={o:'#0C0908',k:'#C4A484',h:'#5E463A',l:'#8A6A55',g:'#7A736F',s:'#B8B0AB',r:'#8B1A32',w:'#D8CCC0',t:'#C79A6D',b:'#5C4033'};
function hero(m,c,px){const y=m==0||m==2?1:0,o=[];
if(c>1)o.push([3,9,10,5,'r']);
o.push([6,12,2,2,'b'],[8,12,2,2,'b'],[5,8,6,4,'slgg'[c]]);
if(c==1)o.push([5,8,6,1,'r'],[10,9,1,3,'r']);
if(c>1)o.push([6,9,2,1,'s'],[5,11,6,1,'s']);
[[[4,8,1,4],[11,8,1,4]],[[4,8,1,2],[3,9,2,2],[11,8,1,2]],[[4,9,1,4],[11,9,1,4]],[[3,8,2,1],[2,5,1,4],[11,8,2,1],[13,5,1,4]]][m].forEach(a=>o.push([...a,'k']));
if(c>1)o.push([4,8,1,1,'s'],[11,8,1,1,'s']);
if(m==1)o.push([11,9,2,2,'k',0,'lf'],[12,9,1,3,'g',0,'lf'],[14,9,1,3,'g',0,'lf'],[12,10,3,1,'s',0,'lf']);
o.push([5,1+y,6,2,'h'],[4,2+y,1,3,'h'],[11,2+y,1,3,'h'],[5,3+y,6,5,'k']);
if(c==3)o.push([5,y,6,1,'t'],[5,y-1,1,1,'t'],[7,y-1,2,1,'t'],[10,y-1,1,1,'t']);
o.push(m?[6,4+y,1,2,'o',0,'ey']:[6,5+y,1,1,'o'],m?[9,4+y,1,2,'o',0,'ey']:[9,5+y,1,1,'o'],m==3?[6,6+y,4,1,'o']:[7,6+y,2,1,'o']);
if(m==0)o.push([12,0,3,1,'w',1,'tw'],[13,1,1,1,'w',1,'tw'],[12,2,3,1,'w',1,'tw']);
if(m==2)o.push([12,3+y,1,2,'s',1,'dr']);
if(m==3)o.push([1,1,1,3,'w',1,'tw'],[0,2,3,1,'w',1,'tw'],[14,1,1,3,'t',1,'tw'],[13,2,3,1,'t',1,'tw']);
const R=(a,e)=>`<rect x="${a[0]-e}" y="${a[1]-e}" width="${a[2]+2*e}" height="${a[3]+2*e}" fill="${PL[e?'o':a[4]]}"${a[6]?` class="${a[6]}"`:''}/>`;
return`<svg viewBox="0 0 16 16" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="hero" style="flex:none"><g transform="translate(0,1)"><g class="bob">${o.filter(a=>!a[5]).map(a=>R(a,1)).join('')}${o.map(a=>R(a,0)).join('')}</g></g></svg>`}
/* ---- views ---- */
function wsw(ws){return`<div class="row" style="margin-bottom:8px"><button class="g" data-a="wv" data-v="-1" aria-label="previous week">[ &lt; ]</button><b>${fd(ws)} - ${fd(ad(ws,6))}${wf?'':' (now)'}</b><button class="g" data-a="wv" data-v="1" aria-label="next week">[ &gt; ]</button></div>`}
function donut(w){const us=S.det&&w.sets>0,g=us?w.gs:w.gm,ks=Object.keys(g).filter(k=>g[k]>0),t=ks.reduce((a,k)=>a+g[k],0);
if(!t)return'<p class="m">// nothing logged this week</p>';let o=0,c='',l='';
ks.forEach(k=>{const p=g[k]/t*100,col=cc(Math.max(0,S.gs.indexOf(k)));c+=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${col}" stroke-width="7" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-o}"/>`;o+=p;l+=`<div><span style="color:${col}">■</span> ${E(k)} ${Math.round(p)}%</div>`});
return`<div class="row"><svg viewBox="0 0 42 42" width="120" height="120" role="img" aria-label="training split">${c}</svg><div>${l}<small>by ${us?'sets':'minutes'}</small></div></div>`}
function six(ws){const a=[];for(let i=5;i>=0;i--){const x=ad(ws,-7*i),w=W(x);a.push([fd(x).replace(' ',''),w.T,w.C])}const mx=Math.max(1,...a.map(r=>Math.max(r[1],r[2])));
return`<div class="ch">${a.map(r=>`<div class="cl"><div class="cb"><i style="height:${r[1]/mx*100}%;background:var(--bu)"></i><i style="height:${r[2]/mx*100}%;background:var(--bl)"></i></div><small>${r[0]}</small></div>`).join('')}</div><p class="m"><span style="color:var(--bu)">■</span> planned <span style="color:var(--bl)">■</span> done</p>`}
function home(){const ws=SW(),w=W(ws),m=mood(w),L=lvl(),c=cl(L.n),mo=ws.slice(0,7),ms=S.wo.filter(x=>x.date.startsWith(mo)),md=Object.keys(S.dn).filter(k=>k.split('_')[1].startsWith(mo)),
mv=ms.reduce((a,x)=>a+vl(x),0),sk=streaks(),left=Math.max(0,w.T-w.C),pb=pbs();
return wsw(ws)+`<p class="m" style="margin-bottom:8px">month ${mo}: ${ms.length+md.length} sessions, ${cv(mv)} ${S.u} lifted</p>
